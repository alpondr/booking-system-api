name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs on real Postgres (see tests/conftest.py), so the
    # runner gets its own throwaway database server for the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: booking_password
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        # Steps start as soon as the container does, which is well before
        # Postgres is ready to accept connections - wait for it.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway values for this job only - not secrets, nothing here
      # ever touches real data.
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DATABASE_URL: postgresql://booking_user:booking_password@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://booking_user:booking_password@localhost:5432/booking_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
